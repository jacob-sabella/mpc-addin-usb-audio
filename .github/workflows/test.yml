# The offline tests on every push and pull request (host tests under the sanitizers, the installer in BusyBox) and the
# armhf build under QEMU, which enforces the glibc floor.
#
# mpc-vst-plugins is pinned to the same commit as release.yml. Move both pins together.
name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  host:
    # Skip workflow runs from fork PRs — only repo-internal pushes / PRs run.
    # Combined with branch-protection "Require approval for first-time
    # contributors" / "Require approval for all outside collaborators",
    # this means only the repo owner can trigger CI.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    name: Linux (host)
    steps:
      - uses: actions/checkout@v4
        with: { path: mpc-addin-usb-audio }
      - uses: actions/checkout@v4
        with:
          repository: sd88me/mpc-vst-plugins
          ref: a4b8f861d07153a2b387d7520331f532f7247502
          path: mpc-vst-plugins
      # TSan can't map its shadow memory with the runner's default 32 bits of mmap randomness
      - run: sudo sysctl -q vm.mmap_rnd_bits=28
      - run: sudo apt-get install -y -q busybox
      - run: TSAN=1 tools/test_host.sh
        working-directory: mpc-addin-usb-audio
  armhf:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: armhf (MPC OS)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm }
      - run: tools/build_armhf.sh
